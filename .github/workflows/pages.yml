name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the memory reconciler compares against earlier commits
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run the validation suite
        run: python3 validation/test_runner.py
      - name: Build site data from the repository
        run: node web/build-data.js
      - name: Collect the static site
        run: |
          mkdir _site
          cp web/index.html web/styles.css web/app.js web/data.js web/favicon.svg web/apple-touch-icon.png web/og-image.png web/robots.txt web/sitemap.xml _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
